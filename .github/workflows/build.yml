name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/example/maclauncher app/src/main/res/values
          mv app_build.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/AndroidManifest.xml
          mv themes.xml app/src/main/res/values/themes.xml
          mv MainActivity.kt app/src/main/java/com/example/maclauncher/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MacLauncher-APK
          path: app/build/outputs/apk/debug/app-debug.apk
